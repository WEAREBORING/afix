<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>site.js test</title>
<link rel="stylesheet" href="../site.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  .card { display: inline-block; padding: 1rem; border: 1px solid #ccc; }
  #result { margin-top: 2rem; font-weight: bold; }
  /* Nabootsing van de Webflow-classes waar de modules op leunen */
  .panel, .menu { display: none; }
  .tab { opacity: .3; background: transparent; color: #000; }
  .tab:first-child { opacity: 1; background: rgb(28, 33, 28); color: rgb(255, 255, 255); }
  [role="tablist"] { position: relative; display: inline-flex; }
  [role="tablist"] .tab { position: relative; z-index: 1; }
  .pill { position: absolute; top: 0; bottom: 0; left: 0; background: rgb(28, 33, 28); }
  .kcard { --_theme---surface--accent: #f9ca00; --_theme---border--subtle: rgba(39, 51, 39, 0.2); display: inline-block; background: rgb(255, 255, 255); padding: 1rem; }
  .kcard .tag { background: rgba(39, 51, 39, 0.1); }
  .kennis-card_arrow { opacity: 0; }
  .tabpanel { display: none; }
  .tabpanel:first-child { display: block; }
  .row { display: flex; gap: 1rem; overflow: auto hidden; scroll-snap-type: x mandatory; width: 30rem; }
  .row > div { flex: none; width: 12rem; height: 4rem; background: #eee; scroll-snap-align: start; }
  .stack { display: grid; }
  .stack > div { grid-area: 1 / 1; opacity: 0; visibility: hidden; }
  .stack > div:first-child { opacity: 1; visibility: visible; }
  .case { --_theme---surface--accent: #f9ca00; display: inline-block; }
  .case-card_logo-view { background: rgb(255, 255, 255); padding: 1rem; }
  .case-card_tags, .case-card_text { opacity: 0; }
</style>
</head>
<body>
<p>Copyright <span data-a-year>2000</span></p>

<div data-a-form-name="testformulier | Test" data-a-form-redirect="/bedankt">
  <form data-name="Oude naam"><input name="naam"></form>
</div>
<div data-a-form-name="extern" data-a-form-redirect="//evil.example/x">
  <form data-name="Oude naam"><input name="naam"></form>
</div>

<a class="card" href="#" data-a-hover>Hover mij <span data-a-hover-x="0.5rem">&rarr;</span></a>

<header data-a-nav>
  <div data-a-dropdown><button type="button" aria-expanded="false" data-a-dropdown-toggle>Strategie <svg width="8" height="8"></svg></button><div data-a-dropdown-panel class="panel"><a href="#">Link</a></div></div>
  <div data-a-dropdown><button type="button" aria-expanded="false" data-a-dropdown-toggle>Websites <svg width="8" height="8"></svg></button><div data-a-dropdown-panel class="panel"><a href="#">Link</a></div></div>
  <button type="button" aria-expanded="false" data-a-nav-toggle>Menu</button>
  <div data-a-nav-menu class="menu">Mobiel menu</div>
</header>

<div data-a-tabs="kennis">
  <div role="tablist"><button type="button" role="tab" aria-selected="true" data-a-tab="blogs" class="tab">Blogs</button><button type="button" role="tab" aria-selected="false" data-a-tab="downloads" class="tab">Downloads</button><button type="button" role="tab" aria-selected="false" data-a-tab="tools" class="tab">Tools</button><div data-a-tab-pill class="pill"></div></div>
  <div><div data-a-tab-panel="blogs" class="tabpanel">Blogs</div><div data-a-tab-panel="downloads" class="tabpanel">Downloads</div><div data-a-tab-panel="tools" class="tabpanel">Tools</div></div>
</div>

<section id="werk">
  <button type="button" data-a-carousel-prev>Vorige</button><button type="button" data-a-carousel-next>Volgende</button>
  <div data-a-carousel="werk" class="row"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>
</section>

<section id="reviews">
  <button type="button" data-a-carousel-prev>Vorige</button><button type="button" data-a-carousel-next>Volgende</button>
  <div data-a-carousel="reviews" class="stack"><div>Review 1</div><div>Review 2</div><div>Review 3</div></div>
  <div data-a-carousel-count><span data-a-carousel-current>01</span><span data-a-carousel-total> / 09</span></div>
</section>

<div data-a-card class="kcard"><div class="kennis-card_meta"><span class="tag">Label</span><p class="kennis-card_date">30 Jan 26</p><div class="kennis-card_arrow">&rarr;</div></div></div>

<div data-a-case class="case"><div class="case-card_logo-view"><div class="case-card_tags">Label</div>Logo<p class="case-card_text">Omschrijving</p></div></div>

<p id="result">Bezig...</p>

<script src="../site.js"></script>
<script>
  // Lokale controle van de modules: open dit bestand via een lokale server (de hover, het slepen en het automatisch
  // doorschuiven controleer je met de hand). Het resultaat verschijnt na een paar seconden.
  var forms = document.querySelectorAll('form');
  var checks = {
    jaartal: document.querySelector('[data-a-year]').textContent === String(new Date().getFullYear()),
    formuliernaam: forms[0].getAttribute('data-name') === 'testformulier | Test',
    redirect: forms[0].getAttribute('data-redirect') === '/bedankt',
    'externe redirect geweigerd': !forms[1].hasAttribute('data-redirect')
  };
  function $(sel) { return document.querySelector(sel); }
  function key(el, k) { el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })); }

  // Nav
  var dds = document.querySelectorAll('[data-a-dropdown]'), t1 = dds[0].querySelector('button'), t2 = dds[1].querySelector('button');
  t1.click();
  checks['dropdown opent'] = t1.getAttribute('aria-expanded') === 'true' && getComputedStyle(dds[0].querySelector('.panel')).display === 'flex' && t1.querySelector('svg').style.transform === 'rotate(180deg)';
  t2.click();
  checks['andere dropdown sluit'] = t1.getAttribute('aria-expanded') === 'false' && getComputedStyle(dds[0].querySelector('.panel')).display === 'none' && t2.getAttribute('aria-expanded') === 'true';
  key(document, 'Escape');
  checks['Escape sluit dropdown'] = t2.getAttribute('aria-expanded') === 'false' && document.activeElement === t2;
  t1.click(); document.body.click();
  checks['klik buiten sluit dropdown'] = t1.getAttribute('aria-expanded') === 'false';
  var burger = $('[data-a-nav-toggle]');
  burger.click();
  checks['hamburger opent menu'] = burger.getAttribute('aria-expanded') === 'true' && getComputedStyle($('[data-a-nav-menu]')).display === 'flex';
  burger.click();
  checks['hamburger sluit menu'] = burger.getAttribute('aria-expanded') === 'false' && getComputedStyle($('[data-a-nav-menu]')).display === 'none';

  // Tabs
  var tabs = document.querySelectorAll('[data-a-tab]'), tpanels = document.querySelectorAll('[data-a-tab-panel]');
  function shown(el) { return getComputedStyle(el).display !== 'none'; }
  checks['tabs: eerste open'] = shown(tpanels[0]) && !shown(tpanels[1]) && tabs[0].tabIndex === 0 && tabs[1].tabIndex === -1;
  tabs[1].click();
  checks['tab wisselt'] = tabs[1].getAttribute('aria-selected') === 'true' && tabs[0].getAttribute('aria-selected') === 'false' && shown(tpanels[1]) && !shown(tpanels[0]);
  var pill = $('[data-a-tab-pill]');
  checks['pil naar actieve tab'] = Math.abs(pill.getBoundingClientRect().left - tabs[1].getBoundingClientRect().left) < 1 && Math.abs(pill.offsetWidth - tabs[1].offsetWidth) < 1 && getComputedStyle(tabs[1]).backgroundColor === 'rgba(0, 0, 0, 0)' && getComputedStyle(tabs[1]).opacity === '1' && getComputedStyle(tabs[0]).opacity === '0.3';
  key(tabs[1], 'ArrowRight'); key(tabs[2], 'ArrowRight');
  checks['pijltjestoets (rond)'] = tabs[0].getAttribute('aria-selected') === 'true' && document.activeElement === tabs[0] && shown(tpanels[0]);
  checks['tab koppelt paneel'] = tpanels[2].getAttribute('aria-labelledby') === tabs[2].id && tabs[2].getAttribute('aria-controls') === tpanels[2].id;

  // Stapel
  var cards = document.querySelectorAll('.stack > div'), sNext = $('#reviews [data-a-carousel-next]'), sPrev = $('#reviews [data-a-carousel-prev]');
  function visible(el) { return getComputedStyle(el).visibility === 'visible'; }
  checks['teller start'] = $('[data-a-carousel-current]').textContent === '01' && $('[data-a-carousel-total]').textContent === ' / 03';
  sNext.click();
  checks['stapel volgende'] = visible(cards[1]) && !visible(cards[0]) && $('[data-a-carousel-current]').textContent === '02';
  sPrev.click(); sPrev.click();
  checks['stapel vorige (rond)'] = visible(cards[2]) && $('[data-a-carousel-current]').textContent === '03';
  checks['stapel aria-live'] = $('.stack').getAttribute('aria-live') === 'polite';

  // Scrollrij: pas na het laden (vóór de eerste weergave negeert de browser smooth scrollen), en dat scrollen duurt even
  var row = $('.row');
  window.addEventListener('load', function waitGsap(_, n) {
    // site.js laadt GSAP zelf van het Webflow-CDN; wacht daarop (maximaal 5 s)
    n = n || 0;
    if (window.gsap || n > 50) setTimeout(rowChecks, 300); else setTimeout(function () { waitGsap(null, n + 1); }, 100);
  });
  function rowChecks() {
    // GSAP is nu geladen: het pijltje draait met een tween
    // (eerst afwachten: een klik op de rijknop is een klik buiten de nav en sluit de dropdown)
    t1.click();
    setTimeout(function () {
      checks['pijltje draait met GSAP'] = !!window.gsap && gsap.getProperty(t1.querySelector('svg'), 'rotation') === 180;
      t1.click();
      rowNext();
    }, 400);
  }
  function caseChecks(done) {
    // Hover op een case (alleen desktop met muis: in een smal venster telt hij als niet van toepassing)
    var item = $('.case'), view = item.querySelector('.case-card_logo-view');
    var desktop = matchMedia('(hover: hover) and (min-width: 992px)').matches;
    item.dispatchEvent(new MouseEvent('mouseenter'));
    setTimeout(function () {
      var shown = getComputedStyle(view).backgroundColor === 'rgb(249, 202, 0)' && getComputedStyle(item.querySelector('.case-card_text')).opacity === '1';
      checks['case-hover kleurt en toont tekst'] = desktop ? shown : !shown;
      item.dispatchEvent(new MouseEvent('mouseleave'));
      setTimeout(function () {
        checks['case-hover terug naar de class'] = getComputedStyle(view).backgroundColor === 'rgb(255, 255, 255)' && view.style.backgroundColor === '' && getComputedStyle(item.querySelector('.case-card_text')).opacity === '0';
        cardChecks(done);
      }, 700);
    }, 700);
  }
  function fanChecks(done) {
    // Stapel zoals Figma (GSAP geladen): actieve kaart recht, de volgende -3° op 66%, die daarna +3° op 33%; teller in de kaart
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    sNext.click();
    setTimeout(function () {
      var at = [].findIndex.call(cards, function (c) { return !c.hasAttribute('aria-hidden'); });
      var g = function (c, p) { return Math.round(gsap.getProperty(c, p) * 100) / 100; };
      var next = cards[(at + 1) % 3], after = cards[(at + 2) % 3];
      checks['stapel: actieve kaart recht en dekkend'] = g(cards[at], 'rotation') === 0 && g(cards[at], 'x') === 0 && getComputedStyle(cards[at]).opacity === '1';
      checks['stapel: volgende kaarten schuin erachter'] = g(next, 'rotation') === -3 && g(next, 'opacity') === 0.66 && g(after, 'rotation') === 3 && g(after, 'opacity') === 0.33 && next.getAttribute('aria-hidden') === 'true';
      checks['stapel: teller in de actieve kaart'] = cards[at].contains($('[data-a-carousel-count]')) && $('[data-a-carousel-current]').textContent === String(at + 1).padStart(2, '0');
      checks['stapel: grab-cursor'] = getComputedStyle(cards[at]).cursor === 'grab';
      done();
    }, still ? 50 : 1200);
  }
  function centerChecks(done) {
    // Smalle tabbalk (zoals op de telefoon): de actieve tab schuift naar het midden
    var bar = $('[role="tablist"]');
    bar.style.display = 'flex'; bar.style.maxWidth = '9rem'; bar.style.overflowX = 'auto';
    tabs[1].click();
    setTimeout(function () {
      var b = bar.getBoundingClientRect(), t = tabs[1].getBoundingClientRect();
      checks['smalle tabbalk: actieve tab in het midden'] = Math.abs((t.left + t.width / 2) - (b.left + b.width / 2)) < 2;
      bar.style.display = bar.style.maxWidth = bar.style.overflowX = '';
      tabs[0].click();
      setTimeout(function () { fanChecks(done); }, 800);
    }, 700);
  }
  function swapChecks(done) {
    // Wissel met GSAP: eerst gaat het oude paneel weg, daarna komt het nieuwe; snel doorklikken eindigt netjes
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    tabs[2].click();
    setTimeout(function () {
      checks['tabwissel: oud paneel eerst weg'] = still ? shown(tpanels[2]) : shown(tpanels[0]) && !shown(tpanels[2]);
      tabs[1].click(); tabs[0].click();
      setTimeout(function () {
        checks['tabwissel: snel klikken eindigt netjes'] = shown(tpanels[0]) && !shown(tpanels[1]) && !shown(tpanels[2]) && tpanels[0].style.opacity === '' && tpanels[0].style.transform === '';
        centerChecks(done);
      }, 1200);
    }, 60);
  }
  function cardChecks(done) {
    var card = $('.kcard'), desktop = matchMedia('(hover: hover) and (min-width: 992px)').matches;
    card.dispatchEvent(new MouseEvent('mouseenter'));
    setTimeout(function () {
      var shown = getComputedStyle(card).backgroundColor === 'rgb(249, 202, 0)' && getComputedStyle(card.querySelector('.kennis-card_arrow')).opacity === '1' && getComputedStyle(card.querySelector('.kennis-card_date')).opacity === '0' && getComputedStyle(card.querySelector('.tag')).backgroundColor === 'rgba(39, 51, 39, 0.2)';
      checks['kaart-hover: geel, pijl in, datum uit'] = desktop ? shown : !shown;
      card.dispatchEvent(new MouseEvent('mouseleave'));
      setTimeout(function () {
        checks['kaart-hover terug naar de class'] = card.style.backgroundColor === '' && getComputedStyle(card).backgroundColor === 'rgb(255, 255, 255)' && getComputedStyle(card.querySelector('.kennis-card_arrow')).opacity === '0' && getComputedStyle(card.querySelector('.kennis-card_date')).opacity === '1';
        swapChecks(done);
      }, 800);
    }, 700);
  }
  function rowNext() {
    var real = [].filter.call(row.children, function (c) { return !c.hasAttribute('aria-hidden'); });
    function atStart(n) { return Math.abs(real[n].getBoundingClientRect().left - row.getBoundingClientRect().left) < 2; }
    checks['rij: kopie ervoor en erna'] = real.length === 5 && row.children.length === 15 && row.children[0].textContent === '1' && row.children[14].textContent === '5';
    checks['rij start op eerste echte kaart'] = atStart(0);
    $('#werk [data-a-carousel-next]').click();
    // Bij reduced motion springt de rij, zonder tween
    setTimeout(function () { checks['rij schuift met GSAP'] = !!window.gsap && gsap.isTweening(row) !== matchMedia('(prefers-reduced-motion: reduce)').matches; }, 100);
    setTimeout(function () {
      checks['rij volgende kaart'] = atStart(1);
      checks['site.js lijnt uit, niet de harde snap'] = row.style.scrollSnapType === 'none' && row.style.touchAction === 'pan-y';
      $('#werk [data-a-carousel-prev]').click();
      setTimeout(function () {
        checks['rij vorige kaart'] = atStart(0);
        $('#werk [data-a-carousel-prev]').click();
        setTimeout(function () {
          checks['eindeloos achteruit'] = atStart(4);
          $('#werk [data-a-carousel-next]').click();
          setTimeout(function () {
            checks['eindeloos vooruit'] = atStart(0);
            caseChecks(report);
          }, 1000);
        }, 1000);
      }, 1000);
    }, 1000);
  }

  function report() {
    var failed = Object.keys(checks).filter(function (k) { return !checks[k]; });
    document.getElementById('result').textContent = failed.length ? 'MISLUKT: ' + failed.join(', ') : 'Alle ' + Object.keys(checks).length + ' controles groen';
  }
</script>
</body>
</html>
